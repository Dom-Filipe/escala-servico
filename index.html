<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@16.0.2/dist/iife/sdk.js"></script>
</head>
<body>
<title>Escala de Serviço 24h</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho fixo com abas; quadro do dia + painéis laterais; tabelas densas para operação */
:root{
  --bg:#eef0eb; --surface:#ffffff; --surface-2:#f6f7f3; --ink:#1a1e18; --muted:#5b6457; --line:#d6dbd0;
  --accent:#3d5a2a; --accent-ink:#ffffff; --accent-soft:#e3ebd9;
  --preta-bg:#1c1d1f; --preta-fg:#f4f4f2; --verm:#b42318; --verm-soft:#fbe6e3;
  --warn:#9a5b00; --warn-soft:#fdf0d8; --ok:#2e6b3a; --hl:#fff1a8; --hl-ink:#1a1e18;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111410; --surface:#191d17; --surface-2:#20251e; --ink:#e5e9e0; --muted:#9aa492; --line:#2e352a;
  --accent:#9fc47f; --accent-ink:#111410; --accent-soft:#25301f;
  --preta-bg:#e9ebe6; --preta-fg:#151614; --verm:#ff8a7a; --verm-soft:#3a1a16;
  --warn:#f0b54d; --warn-soft:#33270f; --ok:#7fc48c; --hl:#5a4d0e; --hl-ink:#fff6c7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111410; --surface:#191d17; --surface-2:#20251e; --ink:#e5e9e0; --muted:#9aa492; --line:#2e352a;
  --accent:#9fc47f; --accent-ink:#111410; --accent-soft:#25301f;
  --preta-bg:#e9ebe6; --preta-fg:#151614; --verm:#ff8a7a; --verm-soft:#3a1a16;
  --warn:#f0b54d; --warn-soft:#33270f; --ok:#7fc48c; --hl:#5a4d0e; --hl-ink:#fff6c7; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:1.5rem;font-weight:600}
h3{font-size:1.1rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.brand h1{font-size:1.9rem;font-weight:700;line-height:1}
.now{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);text-align:right}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{font-family:var(--f-display);font-weight:600;font-size:1.05rem;text-transform:uppercase;letter-spacing:.05em;
  text-decoration:none;color:var(--muted);padding:8px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--ink)}

main{padding-block:20px 60px;display:grid;gap:20px}
.escbar{display:flex;gap:8px;padding-block:10px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.escbtn{display:grid;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.05rem;white-space:nowrap;line-height:1.15}
.escbtn span{font-size:.7rem;font-weight:400;color:var(--muted)}
.escbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.escbtn[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
@media (max-width:640px){.top{position:static}}
.sd{border-left:6px solid var(--preta-bg)}
.sd.V{border-left-color:var(--verm)}
.sd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2.2fr);gap:12px;margin-top:10px}
@media (max-width:720px){.sd-grid{grid-template-columns:1fr}}
.sd-col{background:var(--surface-2);border-radius:6px;padding:10px 12px;cursor:pointer;border:1px solid transparent;min-width:0}
.sd-col.on{border-color:var(--accent)}
.carrossel{min-width:0}
.car-track{display:grid;grid-auto-flow:column;grid-auto-columns:min(380px,86%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 2px 10px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.dcard{scroll-snap-align:start;display:grid;gap:10px;align-content:start;padding:16px}
.dc-date{font-size:2rem;font-weight:700;text-transform:uppercase;letter-spacing:0;color:var(--ink);line-height:1}
.dc-body{display:grid;gap:10px}
.dcard .sd-nms{font-size:1.2rem}
.sd-nms{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-display);font-size:1.3rem;font-weight:600;margin-top:2px}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid-hoje{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid-hoje{grid-template-columns:1fr}}
.stack{display:grid;gap:20px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85rem}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;padding:2px 9px;border-radius:4px;white-space:nowrap}
.chip.P{background:var(--preta-bg);color:var(--preta-fg)}
.chip.V{background:var(--verm);color:#fff}
:root[data-theme="dark"] .chip.V{color:#1a0a08}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.V{color:#1a0a08}}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--verm-soft);color:var(--verm);border-color:transparent}
.tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.info{background:var(--surface-2)}

/* Quadro do dia */
.today{border-top:6px solid var(--preta-bg);padding:18px 18px 16px}
.today.V{border-top-color:var(--verm)}
.today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.date-block .dow{display:block;font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.date-block .big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:.95;text-transform:uppercase}
.motivo{font-size:.85rem;color:var(--muted);margin-top:4px;text-align:right}
.roster{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:0}
.roster li{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.roster .grad{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.roster .nm{font-family:var(--f-display);font-size:1.45rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.roster .meta{font-size:.8rem;color:var(--muted);text-align:right}
.roster li.vazio .nm{color:var(--verm)}

/* Listas de dias */
.days{list-style:none;margin:0;padding:0}
.days li{display:grid;grid-template-columns:5.2rem 6.5rem minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.days li:first-child{border-top:0}
.days .dt{font-family:var(--f-mono);font-size:.85rem}
.days .nms{min-width:0;overflow-wrap:anywhere}
@media (max-width:560px){.days li{grid-template-columns:4.6rem minmax(0,1fr)}.days li .nms{grid-column:1/-1}}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--surface-2);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1}
.stat span{font-size:.78rem;color:var(--muted)}
.plain{list-style:none;padding:0;margin:8px 0 0}
.plain li{padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plain li:first-child{border-top:0}

/* Botões e formulários */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--verm);border-color:var(--verm)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.ctl{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);width:100%;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.controls label.f{width:auto;min-width:140px}

/* Tabelas */
.tbl-wrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-family:var(--f-mono);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.week td{background:var(--surface-2);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:5px 8px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.fds td:first-child{box-shadow:inset 3px 0 0 var(--verm)}
.hl{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 3px;font-weight:600}
.nmlist span+span::before{content:" · ";color:var(--muted)}
.reduz{text-decoration:underline wavy var(--warn);text-underline-offset:3px}

/* Diálogo */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,12,9,.45)}
.dlg{padding:18px;display:grid;gap:14px}
.dlg-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.slot{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;align-items:center}
.slot .n{font-family:var(--f-mono);color:var(--muted);font-size:.8rem}
.hint{font-size:.82rem;color:var(--muted)}
.err{color:var(--verm);font-size:.85rem}

.empty{text-align:center;padding:40px 16px;display:grid;gap:12px;justify-items:center}
.empty p{max-width:46ch;margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
details summary{cursor:pointer;font-weight:600}

/* Quadro tipo planilha */
.q-wrap{overflow:auto;max-height:78vh;margin-top:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.q{border-collapse:separate;border-spacing:0;width:auto;font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.q th,.q td{padding:0;width:30px;min-width:30px;height:26px;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-transform:none;letter-spacing:0;color:var(--ink)}
.q td{color:var(--muted)}
.q thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:500;cursor:pointer}
.q thead tr:nth-child(2) th{top:26px;cursor:default;font-size:.7rem;color:var(--muted)}
.q thead th.V{color:var(--verm);font-weight:700}
.q thead th.hoje{background:var(--accent);color:var(--accent-ink)}
.q .nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 10px;min-width:160px;width:auto;white-space:nowrap;font-family:var(--f-body);font-size:.85rem;font-weight:500;border-right:2px solid var(--line);cursor:default}
.q thead .corner{z-index:4;background:var(--surface-2);font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.q tbody tr:hover td,.q tbody tr:hover .nm{background-color:var(--surface-2)}
.q td.s.P,.qk.s.P{background:var(--preta-bg);color:var(--preta-fg);font-weight:700}
.q td.s.V,.qk.s.V{background:var(--verm);color:#fff;font-weight:700}
.q td.af,.qk.af{background:var(--verm-soft);color:var(--verm);font-size:.66rem;font-weight:600}
.q td.rest,.qk.rest{background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--surface) 3px 7px);color:var(--muted)}
.q td.fora{background:var(--surface-2)}
.q td.apr,.qk.apr{background:var(--accent-soft);color:var(--accent);font-size:.66rem;font-weight:700}
.q td.viol,.qk.viol{box-shadow:inset 0 0 0 3px var(--warn)}
.q .sum{background:var(--surface-2);color:var(--ink);min-width:36px;font-weight:600}
.q tfoot th,.q tfoot td{border-top:2px solid var(--line)}
.q tfoot .nm{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.q tfoot td.ok{color:var(--ok);font-weight:700}
.q tfoot td.bad{background:var(--verm-soft);color:var(--verm);font-weight:700;cursor:pointer}
.qk{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 3px;border:1px solid var(--line);border-radius:3px;font-family:var(--f-mono);font-size:.72rem;margin-right:4px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="eyebrow">Serviço de 24 horas · escala preta e vermelha</span><h1>Escala de Serviço</h1></div>
    <div class="now" id="now"></div>
  </div>
  <nav class="tabs wrap" id="tabs" aria-label="Seções">
    <a href="#hoje" data-tab="hoje">Hoje</a>
    <a href="#previsao" data-tab="previsao">Previsão</a>
    <a href="#quadro" data-tab="quadro">Quadro</a>
    <a href="#militares" data-tab="militares">Militares</a>
    <a href="#afastamentos" data-tab="afastamentos">Afastamentos</a>
    <a href="#ajustes" data-tab="ajustes">Ajustes</a>
  </nav>
  <div class="escbar wrap" id="escbar" role="group" aria-label="Escala"></div>
</header>
<main class="wrap" id="main"><div class="card empty"><h2>Carregando a escala…</h2><p>Buscando militares, afastamentos e o histórico salvo.</p></div></main>
<dialog id="dlg"><form id="dlgForm" class="dlg" novalidate></form></dialog>
<div id="toast" class="toast" hidden></div>

<script>
/* ===================== utilidades de data ===================== */
const pad=n=>String(n).padStart(2,'0');
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOWL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const parse=s=>new Date(s+'T00:00:00Z');
const ymd=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5); // b - a, em dias
const dow=s=>parse(s).getUTCDay();
function today(){const n=new Date();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`}
const br=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const brY=s=>s?br(s)+'/'+s.slice(0,4):'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===================== feriados ===================== */
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return `${y}-${pad(mo)}-${pad(da)}`}
const hcache={};
function feriadosNacionais(y){
  if(hcache[y])return hcache[y];const p=pascoa(y),m={};
  m[`${y}-01-01`]='Confraternização Universal';m[addDays(p,-48)]='Carnaval';m[addDays(p,-47)]='Carnaval';
  m[addDays(p,-2)]='Sexta-feira Santa';m[`${y}-04-21`]='Tiradentes';m[`${y}-05-01`]='Dia do Trabalho';
  m[addDays(p,60)]='Corpus Christi';m[`${y}-09-07`]='Independência do Brasil';m[`${y}-10-12`]='N. Sra. Aparecida';
  m[`${y}-11-02`]='Finados';m[`${y}-11-15`]='Proclamação da República';m[`${y}-11-20`]='Consciência Negra';m[`${y}-12-25`]='Natal';
  return hcache[y]=m}
function feriado(d){
  const c=cfg();const ex=(c.feriadosExtra||[]).find(f=>f.data===d);if(ex)return ex.nome||'Feriado';
  if(c.feriadosNacionais!==false){const n=feriadosNacionais(+d.slice(0,4))[d];if(n&&!(c.feriadosIgnorados||[]).includes(d))return n}
  return null}
function corDia(d){const f=feriado(d),w=dow(d);if(f)return{cor:'V',motivo:'Feriado · '+f};
  if(w===6)return{cor:'V',motivo:'Sábado'};if(w===0)return{cor:'V',motivo:'Domingo'};return{cor:'P',motivo:null}}
const COR={P:'Escala preta',V:'Escala vermelha'};

/* ===================== estado e armazenamento ===================== */
const DEFAULT_CFG={porDia:4,descanso:2,inicio:null,feriadosNacionais:true,feriadosIgnorados:[],feriadosExtra:[]};
const state={militares:{},afast:{},meses:{},config:{},loaded:false,mode:'loading',canWrite:true,busy:false};
let db=null,downloads=null;
/* Escalas: cada uma tem seus próprios militares, escalados por dia e histórico; regras e feriados são comuns. */
const ESC={sgt:{nome:'Sargento de dia',curto:'Sgt de dia',def:1,grad:'3º Sgt',quem:'sargentos'},
           cabo:{nome:'Cabo de dia',curto:'Cb de dia',def:1,grad:'Cb',quem:'cabos'},
           guarda:{nome:'Guarda',curto:'Guarda',def:4,grad:'Sd',quem:'soldados'}};
const ESC_ORDEM=['guarda','cabo','sgt'];
const escOf=m=>m.escala&&ESC[m.escala]?m.escala:'guarda';
const milsEsc=(e)=>Object.values(state.militares).filter(m=>escOf(m)===(e||ui.esc)).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
const monthKey=(e,m)=>e==='guarda'?m:e+'_'+m;
function porDiaDe(e,c0){const c=c0||{...DEFAULT_CFG,...state.config};const pe=c.porDiaEscala||{};
  const v=pe[e]!=null?pe[e]:(e==='guarda'?c.porDia:ESC[e].def);return Math.max(1,parseInt(v)||ESC[e].def)}
function cfg(e){e=e||(typeof ui!=='undefined'?ui.esc:'guarda');const c={...DEFAULT_CFG,...state.config};if(!c.inicio)c.inicio=today();
  c.porDia=porDiaDe(e,c);c.descanso=Math.max(0,parseInt(c.descanso));if(isNaN(c.descanso))c.descanso=2;return c}
const store={
  async setMilitar(id,data){if(db)await db.doc('militares/'+id).set(data);state.militares[id]={...data,id}},
  async delMilitar(id){if(db)await db.doc('militares/'+id).delete();delete state.militares[id]},
  async setAfast(id,data){if(db)await db.doc('afastamentos/'+id).set(data);state.afast[id]={...data,id}},
  async delAfast(id){if(db)await db.doc('afastamentos/'+id).delete();delete state.afast[id]},
  async setConfig(data){if(db)await db.doc('config/geral').set(data);state.config={...data}},
  async setMonth(m,dias){if(db)await db.doc('meses/'+m).set({dias});state.meses[m]={dias}},
};
const getOv=(d,e)=>state.meses[monthKey(e||ui.esc,d.slice(0,7))]?.dias?.[d]||null;

/* ===================== motor da escala ===================== */
/* Regras:
   - Dia vermelho = sábado, domingo ou feriado; demais = preto. Cada cor tem sua própria folga.
   - Folga de uma cor = nº de dias daquela cor desde o último serviço nela, contando só os dias em que o militar estava disponível.
   - Escala-se o mais folgado na cor do dia; desempate: há mais tempo sem serviço (qualquer cor), depois a ordem da lista.
   - Descanso mínimo: após um serviço, o militar fica fora pelos próximos N dias (2 dias = 48 h).
   - Afastado não concorre e não acumula folga. Dias já fixados (passados ou ajustados à mão) são respeitados. */
function afastIndex(){const idx={};for(const a of Object.values(state.afast))(idx[a.militarId]||=[]).push(a);return idx}
function simulate(fim,opt={}){
  const E=opt.esc||ui.esc,c=cfg(E),N=c.porDia,R=c.descanso;
  const mils=milsEsc(E);
  const ai=afastIndex();
  const afOn=(id,d)=>(ai[id]||[]).find(a=>a.inicio<=d&&(!a.fim||d<=a.fim));
  const st={},days=[];let before=null,after=null;
  for(let d=c.inicio;d<=fim;d=addDays(d,1)){
    const ov=getOv(d,E),cd=corDia(d),cor=ov?.cor||cd.cor;
    const ativos=mils.filter(m=>(!m.entrada||m.entrada<=d)&&(!m.saida||d<m.saida));
    for(const m of ativos)if(!st[m.id])st[m.id]={P:+m.folgaIniP||0,V:+m.folgaIniV||0,last:null};
    const af={},apr={},obr={};const d1=addDays(d,-1),d2=addDays(d,-2);
    for(const m of ativos){const a=afOn(m.id,d);if(a){af[m.id]=a;continue}
      const l=ai[m.id]||[];
      if(l.some(x=>x.fim===d1))apr[m.id]=true;                       // dia da apresentação: não concorre
      else if(l.some(x=>x.fim===d2)&&!afOn(m.id,d1))obr[m.id]=true;  // 24 h depois da apresentação: entra de serviço
    }
    if(opt.before===d)before={st:clone(st),af,apr,obr,ativos,cor};
    let ids,reduced=[],deficit=0;
    const fixAhead=new Set();for(let k=1;k<=R;k++){const o=getOv(addDays(d,k),E);if(o)(o.ids||[]).forEach(i=>fixAhead.add(i))}
    const descansado=m=>{const l=st[m.id].last;return !l||diff(l,d)>R};
    let pre=null;
    if(opt.trace){pre={};for(const m of ativos){const s=st[m.id];pre[m.id]={f:s[cor],last:s.last,af:af[m.id]||null,rest:!descansado(m),fix:fixAhead.has(m.id),apr:!!apr[m.id],obr:!!obr[m.id]}}}
    if(ov){ids=(ov.ids||[]).filter(Boolean)}
    else{
      const disp=ativos.filter(m=>!af[m.id]&&!apr[m.id]&&!fixAhead.has(m.id));
      const sc=(a,b)=>{const A=st[a.id],B=st[b.id];if(B[cor]!==A[cor])return B[cor]-A[cor];
        const la=A.last||'',lb=B.last||'';if(la!==lb)return la<lb?-1:1;return (a.ordem||0)-(b.ordem||0)};
      const forc=disp.filter(m=>obr[m.id]).sort(sc).slice(0,N).map(m=>m.id);
      ids=forc.concat(disp.filter(m=>descansado(m)&&!forc.includes(m.id)).sort(sc).slice(0,N-forc.length).map(m=>m.id));
      if(ids.length<N){reduced=disp.filter(m=>!descansado(m)&&diff(st[m.id].last,d)>0).sort(sc).slice(0,N-ids.length).map(m=>m.id);ids=ids.concat(reduced)}
      deficit=N-ids.length;
    }
    const S=new Set(ids);
    for(const m of ativos){const s=st[m.id];if(S.has(m.id)){s[cor]=0;s.last=d}else s[cor]++}  // folga conta inclusive afastado
    days.push({d,cor,motivo:(ov?.cor&&ov.cor!==cd.cor)?null:cd.motivo,ids,ov,reduced,deficit,af,apr,obr,pre});
    if(opt.after===d)after=clone(st);
  }
  return{days,st,before,after};
}
function nome(id,fb){const m=state.militares[id];return m?`${m.grad?m.grad+' ':''}${m.nome}`:(fb||'(removido)')}
function nomeDia(day,i){return nome(day.ids[i],day.ov?.nomes?.[i])}

/* Fixa no histórico todos os dias passados ainda calculados, para que mudanças futuras não reescrevam o passado. */
async function freezePast(){
  const y=addDays(today(),-1),c=cfg();if(c.inicio>y)return;
  for(const E of ESC_ORDEM){
    if(!milsEsc(E).length)continue;
    const {days}=simulate(y,{esc:E});const byM={};
    for(const x of days){if(x.ov)continue;(byM[monthKey(E,x.d.slice(0,7))]||={})[x.d]={ids:x.ids,nomes:x.ids.map(i=>nome(i)),cor:x.cor,auto:true}}
    for(const [m,add] of Object.entries(byM)){const cur=state.meses[m]?.dias||{};await store.setMonth(m,{...cur,...add})}
  }
  if(!state.config.inicio)await store.setConfig({...state.config,inicio:c.inicio});
}
async function mutate(fn,okMsg){
  if(!state.canWrite){toast('Você tem acesso só de leitura a esta escala.');return false}
  if(state.busy)return false;state.busy=true;
  try{await freezePast();await fn();if(okMsg)toast(okMsg);return true}
  catch(e){console.error(e);const c=e&&e.code;
    if(c==='invalid_argument'){state.canWrite=false;toast('Não foi possível salvar: seu acesso é só de leitura.')}
    else if(c==='quota_exceeded')toast('Limite de armazenamento atingido. Remova afastamentos antigos.');
    else toast('Não foi possível salvar agora. Tente de novo em instantes.');return false}
  finally{state.busy=false;render()}
}

const NOMES_EX=['Almeida','Barbosa','Cardoso','Duarte','Esteves','Farias','Gomes','Henrique','Ivo','Jardim','Lacerda','Macedo','Nogueira','Oliveira','Peixoto',
  'Quintana','Rezende','Siqueira','Tavares','Uchôa','Vieira','Xavier','Zanetti','Amaral','Brandão','Coelho','Dantas','Freitas','Guimarães','Leal'];
const NOMES_CB=['Andrade','Bastos','Campos','Dias','Fontes','Garcia','Lopes','Moraes','Neves','Pires','Ramos','Souza'];
const NOMES_SGT=['Araújo','Bezerra','Cavalcanti','Diniz','Falcão','Gusmão','Holanda','Lima','Medeiros','Nunes','Pacheco','Queiroz','Rocha','Teixeira','Valente','Vasconcelos'];
function espalhar(n,k,i){const per=Math.max(1,Math.round(n/k));return{P:Math.floor((n-1-i)*per/n),V:Math.floor(((i+Math.floor(n/2))%n)*per/n)}}
function exemplo(escs){
  escs=escs||ESC_ORDEM;const t=today(),ini=state.config.inicio||addDays(t,-12),mil={},af={};
  if(escs.includes('guarda')){
    NOMES_EX.forEach((n,i)=>{const id='m'+pad(i+1);mil[id]={id,escala:'guarda',ordem:i+1,grad:'Sd',nome:n,entrada:ini,saida:null,
      folgaIniP:Math.floor((29-i)/4),folgaIniV:Math.floor(((i+13)%30)/4),exemplo:true}});
    af.a1={id:'a1',militarId:'m07',tipo:'Férias',inicio:addDays(t,-8),fim:addDays(t,21),obs:'Exemplo'};
    af.a2={id:'a2',militarId:'m11',tipo:'Saúde',inicio:addDays(t,-1),fim:addDays(t,3),obs:'Exemplo · dispensa médica'};
    af.a3={id:'a3',militarId:'m21',tipo:'Missão',inicio:addDays(t,7),fim:addDays(t,14),obs:'Exemplo'};
  }
  if(escs.includes('cabo'))NOMES_CB.forEach((n,i)=>{const f=espalhar(12,1,i),id='c'+pad(i+1);
    mil[id]={id,escala:'cabo',ordem:i+1,grad:'Cb',nome:n,entrada:ini,saida:null,folgaIniP:f.P,folgaIniV:f.V,exemplo:true}});
  if(escs.includes('sgt'))NOMES_SGT.forEach((n,i)=>{const f=espalhar(16,1,i),id='s'+pad(i+1);
    mil[id]={id,escala:'sgt',ordem:i+1,grad:i<4?'1º Sgt':i<9?'2º Sgt':'3º Sgt',nome:n,entrada:ini,saida:null,folgaIniP:f.P,folgaIniV:f.V,exemplo:true}});
  return{mil,af,config:{...DEFAULT_CFG,...state.config,inicio:ini,porDiaEscala:{guarda:4,cabo:1,sgt:1}}};
}

let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3800)}
let rq=false;function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;draw()})}

function draw(){
  const t=today(),d=parse(t);
  $('#now').innerHTML=`${DOWL[d.getUTCDay()]}<br>${brY(t)}${state.mode==='appwrite'?'<br><button class="link small" data-act="sair">Sair</button>':''}`;

  $('#escbar').innerHTML=ESC_ORDEM.map(e=>{const n=state.loaded?milsEsc(e).length:'';return `<button type="button" class="escbtn" data-act="setEsc" data-e="${e}" aria-pressed="${ui.esc===e}">${ESC[e].nome}<span class="mono">${n!==''?n+' '+ESC[e].quem:''} · ${state.loaded?porDiaDe(e):ESC[e].def}/dia</span></button>`}).join('');

  const views={hoje:viewHoje,previsao:viewPrevisao,quadro:viewQuadro,militares:viewMilitares,afastamentos:viewAfast,ajustes:viewAjustes};

function banners(){
  let b='';

function emptyState(){
  const E=ESC[ui.esc],n={guarda:30,cabo:12,sgt:16}[ui.esc];
  return `<section class="card empty"><h2>Nenhum militar na escala de ${E.nome.toLowerCase()}</h2>
  <p>Cadastre os ${E.quem} que concorrem a esta escala (${porDiaDe(ui.esc)} por dia). Você pode colar a lista inteira de uma vez ou começar com ${n} ${E.quem} de exemplo para ver como a escala se comporta.</p>
  <div class="row"><button class="btn pri" data-act="importar">Importar lista</button><button class="btn" data-act="addMil">Adicionar um militar</button><button class="btn" data-act="carregarEx">Carregar ${n} de exemplo</button></div></section>`}
/* Cartões "serviço do dia" (todas as escalas) para deslizar na Previsão */
function cartoesDias(ini,n){
  const fim=addDays(ini,n-1),t=today();
  const es=['sgt','cabo','guarda'].filter(e=>milsEsc(e).length);
  const maps={};for(const e of es){maps[e]={};for(const x of simulate(fim,{esc:e}).days)if(x.d>=ini)maps[e][x.d]=x}
  let cards='';
  for(let d=ini;d<=fim;d=addDays(d,1)){
    const any=es.map(e=>maps[e][d]).find(Boolean);if(!any)continue;
    const cor=any.cor,dd=parse(d);
    const blocos=es.map(e=>{const x=maps[e][d];if(!x)return '';
      const warn=x.deficit||x.reduced.length||x.ov?.manual;
      return `<div class="sd-col ${ui.esc===e?'on':''}" data-act="editDayEsc" data-e="${e}" data-d="${d}"><span class="eyebrow">${ESC[e].nome}${x.ov?.manual?' · ajustado':''}</span><div class="sd-nms">${x.ids.length?x.ids.map((id,i)=>`<span class="${x.reduced.includes(id)?'reduz':''}">${id===ui.pvM?`<span class="hl">${esc(nomeDia(x,i))}</span>`:esc(nomeDia(x,i))}</span>`).join(''):''}${x.deficit?`<span class="err">faltam ${x.deficit}</span>`:''}</div></div>`}).join('');
    cards+=`<article class="card sd dcard ${cor}" data-d="${d}"><div class="spread"><div><span class="eyebrow">${d===t?'Hoje · ':d===addDays(t,1)?'Amanhã · ':''}${DOWL[dow(d)]}</span><h3 class="dc-date">${pad(dd.getUTCDate())} ${MES[dd.getUTCMonth()]}</h3></div><div style="text-align:right">${chip(cor)}${any.motivo&&any.motivo.startsWith('Feriado')?`<div class="small muted" style="margin-top:4px">${esc(any.motivo.replace('Feriado · ',''))}</div>`:''}</div></div><div class="dc-body">${blocos}</div></article>`;
  }
  return `<section class="carrossel"><div class="spread"><h2>Serviço dia a dia</h2><div class="row"><button class="btn sm" data-act="carMove" data-dir="-1" aria-label="Dia anterior">◂</button><button class="btn sm" data-act="carMove" data-dir="0">Início</button><button class="btn sm" data-act="carMove" data-dir="1" aria-label="Próximo dia">▸</button></div></div>
    <p class="small muted" style="margin:4px 0 0">Deslize para o lado para ver os próximos dias. Toque numa escala para trocar militares naquele dia.</p>
    <div class="car-track" id="car-track">${cards}</div></section>`;
}
function servicoDoDia(){
  const t=today(),c=cfg(),base=t<c.inicio?c.inicio:t;
  const cols=['sgt','cabo','guarda'].filter(e=>milsEsc(e).length).map(e=>{
    const day=simulate(base,{esc:e}).days.find(x=>x.d===base);if(!day)return '';
    return `<div class="sd-col ${ui.esc===e?'on':''}" data-act="setEsc" data-e="${e}"><span class="eyebrow">${ESC[e].nome}</span><div class="sd-nms">${day.ids.length?day.ids.map((id,i)=>`<span>${esc(nomeDia(day,i))}</span>`).join(''):'<span class="err">sem militar</span>'}</div></div>`}).join('');
  if(!cols)return '';
  return `<section class="card sd ${corDia(base).cor}"><div class="spread"><h3>Serviço de ${base===t?'hoje':br(base)} · todas as escalas</h3>${chip(getOv(base)?.cor||corDia(base).cor)}</div><div class="sd-grid">${cols}</div></section>`;
}

function chip(cor){return `<span class="chip ${cor}">${COR[cor]}</span>`}
function situacao(id,sim,t){
  const c=cfg(),b=sim.before;if(!b)return{txt:'—',cls:''};
  const m=state.militares[id];if(m.entrada&&m.entrada>t)return{txt:'Entra em '+br(m.entrada),cls:'info'};
  if(m.saida&&t>=m.saida)return{txt:'Fora da escala',cls:'info'};
  const a=b.af[id];if(a)return{txt:`${a.tipo}${a.fim?' até '+br(a.fim):' · sem retorno'}`,cls:'bad'};
  const hoje=sim.days.find(x=>x.d===t);if(hoje&&hoje.ids.includes(id))return{txt:b.obr[id]?'De serviço hoje (retorno)':'De serviço hoje',cls:'ok'};
  if(b.apr[id])return{txt:'Apresentação hoje · serviço amanhã',cls:'ok'};
  const l=b.st[id]?.last;if(l&&diff(l,t)<=c.descanso)return{txt:'Descanso (serviço '+br(l)+')',cls:'warn'};
  return{txt:'Disponível',cls:''};
}

function csvTexto(sep){
  const c=cfg(),{days}=previsaoDados();const N=Math.max(c.porDia,...days.map(x=>x.ids.length));
  const head=['Data','Dia','Escala','Motivo',...Array.from({length:N},(_,i)=>'Militar '+(i+1)),'Observação'];
  const q=v=>{v=String(v??'');return /[;\t"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[head.join(sep)];
  for(const x of days){const ns=Array.from({length:N},(_,i)=>x.ids[i]?nomeDia(x,i):'');
    const obs=[x.deficit?`faltam ${x.deficit}`:'',x.reduced.length?'descanso reduzido':'',x.ov?.manual?'ajustado':''].filter(Boolean).join(', ');
    lines.push([brY(x.d),DOWL[dow(x.d)],x.cor==='P'?'Preta':'Vermelha',(x.motivo||'').replace('Feriado · ','Feriado: '),...ns,obs].map(q).join(sep))}
  return lines.join('\r\n');
}

/* ---------- Quadro (planilha de conferência) ---------- */
const AFCOD={'Saúde':'SA','Férias':'FÉ','Dispensa':'DP','Missão':'MI','Curso':'CU','Instalação':'IN','Núpcias':'NU','Luto':'LU','Outro':'OU'};
function quadroDados(){
  const c=cfg(),mes=ui.qMes||today().slice(0,7);
  const first=mes+'-01',lastD=addDays(addDays(first,32).slice(0,7)+'-01',-1);
  const sim=simulate(lastD,{trace:true});
  const days=sim.days.filter(x=>x.d>=first);
  const mils=milsEsc()
    .filter(m=>(!m.entrada||m.entrada<=lastD)&&(!m.saida||m.saida>first));
  // conferência de cada dia
  const N=c.porDia;
  for(const x of days){
    const p=x.pre||{},prob=[];
    if(x.ids.length!==N)prob.push(`${x.ids.length} escalados (deveriam ser ${N})`);
    for(const id of x.ids){const q=p[id];if(!q){prob.push(nome(id)+' não está na escala nesse dia');continue}
      if(q.af)prob.push(`${nome(id)} escalado durante ${q.af.tipo.toLowerCase()}`);
      if(q.rest)prob.push(`${nome(id)} com menos de ${c.descanso*24} h de descanso (serviço em ${br(q.last)})`);
      if(q.apr)prob.push(`${nome(id)} escalado no dia da apresentação`)}
    for(const [id,q] of Object.entries(p))if(q.obr&&!x.ids.includes(id))prob.push(`${nome(id)} deveria entrar de serviço 24 h após a apresentação`);
    const eleg=Object.entries(p).filter(([id,q])=>!q.af&&!q.rest&&!q.fix&&!q.apr&&!q.obr);
    const fora=eleg.filter(([id])=>!x.ids.includes(id)),dentro=x.ids.map(id=>p[id]).filter(q=>q&&!q.af&&!q.rest&&!q.obr&&!q.apr);
    if(fora.length&&dentro.length){const maxF=Math.max(...fora.map(([,q])=>q.f)),minD=Math.min(...dentro.map(q=>q.f));
      if(maxF>minD){const quem=fora.filter(([,q])=>q.f>minD).map(([id,q])=>`${nome(id)} (${q.f})`);prob.push(`Fora da ordem de folga: ficou de fora ${quem.join(', ')}, mais folgado que quem entrou (${minD})`)}}
    x.prob=prob;
  }
  return{mes,first,lastD,days,mils};
}

    ${probs.length?`<ul class="plain small" style="margin-top:8px">${probs.map(x=>`<li><span class="mono">${DOW[dow(x.d)]} ${br(x.d)}</span><span>${x.prob.map(esc).join('<br>')}</span></li>`).join('')}</ul>`:''}

function quadroTexto(){
  const {days,mils}=quadroDados();
  const lines=[['Militar',...days.map(x=>`${br(x.d)} ${DOW[dow(x.d)]}`),'Pretos','Vermelhos','Total'].join('\t')];
  for(const m of mils){let P=0,V=0;const cs=days.map(x=>{const q=x.pre?.[m.id];if(!q)return '';if(x.ids.includes(m.id)){x.cor==='P'?P++:V++;return 'S'}if(q.af)return AFCOD[q.af.tipo]||'AF';return String(q.f)});
    lines.push([nome(m.id),...cs,P,V,P+V].join('\t'))}
  lines.push(['Escalados',...days.map(x=>x.ids.length)].join('\t'));
  lines.push(['Conferência',...days.map(x=>x.prob.length?'ERRO':'OK')].join('\t'));
  return lines.join('\r\n');
}

function viewAjustes(){
  const c=cfg(),y=+today().slice(0,4);
  const nac=[y,y+1].flatMap(yy=>Object.entries(feriadosNacionais(yy))).sort((a,b)=>a[0]<b[0]?-1:1).filter(([d])=>d>=addDays(today(),-30));
  const ign=c.feriadosIgnorados||[];
  return `<section class="card"><h2>Regras da escala</h2>

      <label class="f">Dias de descanso após o serviço<input type="number" id="cf-desc" min="0" max="7" value="${c.descanso}"><span class="hint">2 dias = 48 h. Quem tira sexta não pega sábado nem domingo.</span></label>
      <label class="f">Início da contagem<input type="date" id="cf-ini" value="${c.inicio}"><span class="hint">Data a partir da qual valem as folgas iniciais.</span></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn pri" data-act="salvarCfg">Salvar regras</button></div></section>
  <section class="card"><h2>Feriados (escala vermelha)</h2>
    <p class="small muted" style="margin:6px 0 10px">Os feriados nacionais são calculados sozinhos, inclusive Carnaval e Corpus Christi. Desmarque os que a sua OM não considera. Acrescente os feriados municipais e estaduais abaixo.</p>
    <label class="row small"><input type="checkbox" id="cf-nac" ${c.feriadosNacionais!==false?'checked':''}> Usar feriados nacionais</label>
    <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Feriado</th><th>Vermelha?</th></tr></thead><tbody>
    ${nac.map(([d,n])=>`<tr><td class="mono">${DOW[dow(d)]} ${brY(d)}</td><td>${esc(n)}</td><td><input type="checkbox" data-act="togFer" data-d="${d}" ${ign.includes(d)?'':'checked'} aria-label="Considerar ${esc(n)}"></td></tr>`).join('')}
    ${(c.feriadosExtra||[]).slice().sort((a,b)=>a.data<b.data?-1:1).map(f=>`<tr><td class="mono">${DOW[dow(f.data)]} ${brY(f.data)}</td><td>${esc(f.nome)} <span class="tag">local</span></td><td><button class="btn sm" data-act="rmFer" data-d="${f.data}">Remover</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="controls" style="margin-top:12px"><label class="f">Data<input type="date" id="fe-d"></label><label class="f" style="min-width:220px">Nome<input type="text" id="fe-n" placeholder="Ex.: Aniversário de Praia Grande"></label><button class="btn" data-act="addFer">Adicionar feriado</button></div>
  </section>
  <section class="card"><h2>Backup dos dados</h2>
    <p class="small muted" style="margin:6px 0 12px">Baixe um arquivo com todos os militares, afastamentos, histórico e regras. Use para guardar uma cópia ou para levar os dados para outra versão do sistema (por exemplo, da versão no Claude para a versão no Appwrite).</p>
    <div class="row"><button class="btn" data-act="backup">Baixar backup (JSON)</button>${state.canWrite?'<button class="btn" data-act="importarArq">Importar backup</button><input type="file" id="bk-file" accept=".json,application/json" hidden>':''}</div>
    <p class="hint" style="margin-top:8px">Importar grava por cima dos registros com o mesmo identificador e mantém os demais.</p></section>
  <section class="card"><h2>Como a escala é montada</h2><ol class="small" style="margin:8px 0 0;padding-left:1.2rem;display:grid;gap:4px;max-width:70ch">
    <li>Sábado, domingo e feriado são <b>escala vermelha</b>; os demais dias são <b>escala preta</b>. Cada cor tem uma folga separada.</li>
    <li>Cada escala (guarda, cabo de dia e sargento de dia) é independente, com seus próprios militares e folgas. Em cada dia entram os militares com maior folga naquela cor. Empate: quem está há mais tempo sem serviço; depois a ordem da lista.</li>
    <li>Quem tirou serviço fica ${c.descanso} dia(s) sem poder ser escalado (${c.descanso*24} h). Se faltar gente, o sistema usa quem tem menos descanso e avisa.</li>
    <li>Afastado não concorre, mas a folga dele continua contando. Terminado o afastamento, ele se apresenta no dia seguinte e entra de serviço 24 h depois da apresentação. Militar novo entra com a folga inicial informada no cadastro.</li>
    <li>Dias passados ficam gravados no histórico. Trocas feitas à mão são respeitadas, e o restante da previsão se recalcula a partir delas.</li></ol></section>`;
}

function dlgDay(d){
  const c=cfg();if(d<c.inicio){toast('Esse dia é anterior ao início da contagem.');return}
  const sim=simulate(addDays(d,c.descanso+1),{before:d});const day=sim.days.find(x=>x.d===d),b=sim.before;if(!day||!b)return;
  const R=c.descanso;
  const info=m=>{const s=b.st[m.id],a=b.af[m.id];const l=s.last;const rest=l&&diff(l,d)<=R;
    const fut=sim.days.find(x=>x.d>d&&x.d<=addDays(d,R)&&x.ids.includes(m.id));
    return{m,f:s[day.cor],a,rest,fut,l,apr:b.apr[m.id],obr:b.obr[m.id]}};
  const cands=b.ativos.map(info).sort((x,y)=>(!!y.obr-!!x.obr)||(!!x.a-!!y.a)||(!!x.apr-!!y.apr)||(!!x.rest-!!y.rest)||(y.f-x.f));
  const N=Math.max(c.porDia,day.ids.length);
  const opt=(cur)=>`<option value="">— vago —</option>`+cands.map(k=>{const lab=`${nome(k.m.id)} · folga ${k.f}${k.obr?' · retorno: serviço obrigatório':''}${k.apr?' · dia da apresentação':''}${k.a?' · '+k.a.tipo:''}${k.rest?' · descanso (serv. '+br(k.l)+')':''}${k.fut?' · escalado '+br(k.fut.d):''}`;
    return `<option value="${k.m.id}" ${cur===k.m.id?'selected':''} ${k.a&&cur!==k.m.id?'disabled':''}>${esc(lab)}</option>`}).join('');
  const slots=Array.from({length:N},(_,i)=>`<div class="slot"><span class="n">${i+1}</span><select class="ctl" id="dd-s${i}">${opt(day.ids[i]||'')}</select></div>`).join('');
  const dd=parse(d);
  openDlg('day',`<div class="spread"><h2>${DOWL[dow(d)]}, ${pad(dd.getUTCDate())} ${MES[dd.getUTCMonth()]}</h2>${chip(day.cor)}</div>
  <p class="hint">${day.motivo?esc(day.motivo)+' · ':''}Lista em ordem de folga na ${day.cor==='P'?'preta':'vermelha'}. Afastados ficam bloqueados; quem está em descanso aparece marcado.</p>
  <div style="display:grid;gap:8px">${slots}</div>
  <label class="f">Observação<input id="dd-o" value="${esc(day.ov?.obs||'')}" placeholder="Ex.: troca a pedido, Sd X por Sd Y"></label>
  ${foot(day.ov?.manual&&d>=today()?'<button type="button" class="btn" data-act="autoDay">Voltar ao automático</button>':'')}`,{d,cor:day.cor,N});
}

  importarArq:()=>{const i=$('#bk-file');if(i)i.click()},
  editDayEsc:e=>{if(ui.esc!==e.dataset.e){ui.esc=e.dataset.e;saveUi();render();setTimeout(()=>dlgDay(e.dataset.d),30)}else dlgDay(e.dataset.d)},
  carMove:e=>{const tr=$('#car-track');if(!tr)return;const c=tr.querySelector('.dcard');const w=c?c.getBoundingClientRect().width+12:300;const dir=+e.dataset.dir;

  qMes:e=>{ui.qMes=e.dataset.m||null;render()},
  async qCopiar(){const txt=quadroTexto();try{await navigator.clipboard.writeText(txt);toast('Quadro copiado. Cole no Excel (Ctrl+V).')}
    catch(e){openDlg('copy',`<h2>Copiar quadro</h2><p class="hint">Selecione tudo (Ctrl+A), copie e cole no Excel.</p><textarea class="ctl" id="cp-t" rows="12" readonly>${esc(txt)}</textarea><div class="dlg-foot"><span></span><button type="button" class="btn" data-act="fechar">Fechar</button></div>`);$('#cp-t').select()}},
  async carregarEx(){const ex=exemplo([ui.esc]);await mutate(async()=>{await store.setConfig(ex.config);for(const m of Object.values(ex.mil))if(!state.militares[m.id])await store.setMilitar(m.id,m);for(const a of Object.values(ex.af))if(!state.afast[a.id])await store.setAfast(a.id,a)},`${ESC[ui.esc].quem} de exemplo carregados`)},
  setEsc:e=>{ui.esc=e.dataset.e;ui.pvM='';saveUi();if(ui.tab==='afastamentos')location.hash='#hoje';render()},
  async limparEx(e){if(e.dataset.ok!=='1'){e.dataset.ok='1';e.textContent='Confirmar: remover exemplos';return}
    await mutate(async()=>{for(const m of milsEsc().filter(m=>m.exemplo)){for(const a of Object.values(state.afast).filter(a=>a.militarId===m.id))await store.delAfast(a.id);await store.delMilitar(m.id)}},'Exemplos removidos')},
  async delMil(e){if(e.dataset.ok!=='1'){e.dataset.ok='1';e.textContent='Confirmar exclusão';return}
    const id=dlgData.id;closeDlg();await mutate(async()=>{for(const a of Object.values(state.afast).filter(a=>a.militarId===id))await store.delAfast(a.id);await store.delMilitar(id)},'Militar excluído')},
  async delAfast(e){if(e.dataset.ok!=='1'){e.dataset.ok='1';e.textContent='Confirmar exclusão';return}
    const id=dlgData.id;closeDlg();await mutate(()=>store.delAfast(id),'Afastamento excluído')},
  async retorno(e){const a=state.afast[e.dataset.id];const fim=addDays(today(),-1);
    await mutate(async()=>{if(fim<a.inicio)await store.delAfast(a.id);else await store.setAfast(a.id,{...a,fim})},'Retorno registrado: volta à escala hoje')},
  async autoDay(){const d=dlgData.d,m=monthKey(ui.esc,d.slice(0,7));closeDlg();
    await mutate(async()=>{const dias={...(state.meses[m]?.dias||{})};delete dias[d];await store.setMonth(m,dias)},'Dia voltou ao cálculo automático')},
  async salvarCfg(){const c=cfg();const pe={};for(const e of ESC_ORDEM)pe[e]=parseInt($('#cf-por-'+e).value);const por=Math.min(...Object.values(pe)),de=parseInt($('#cf-desc').value),ini=$('#cf-ini').value;
    if(!(por>=1)||!(de>=0)||!ini){toast('Confira os valores: por dia ≥ 1, descanso ≥ 0 e uma data de início.');return}

  async togFer(e){const c=cfg(),d=e.dataset.d;let ign=[...(c.feriadosIgnorados||[])];ign=e.checked?ign.filter(x=>x!==d):[...ign,d];
    await mutate(()=>store.setConfig({...state.config,feriadosIgnorados:ign}),e.checked?'Feriado considerado':'Feriado ignorado')},
  async addFer(){const c=cfg(),d=$('#fe-d').value,n=$('#fe-n').value.trim();if(!d){toast('Escolha a data do feriado.');return}
    await mutate(()=>store.setConfig({...state.config,feriadosExtra:[...(c.feriadosExtra||[]).filter(f=>f.data!==d),{data:d,nome:n||'Feriado'}]}),'Feriado adicionado')},

  async copiar(){const txt=csvTexto('\t');try{await navigator.clipboard.writeText(txt);toast('Tabela copiada. Cole no Excel.')}
    catch(e){openDlg('copy',`<h2>Copiar tabela</h2><p class="hint">Selecione tudo (Ctrl+A), copie e cole no Excel.</p><textarea class="ctl" id="cp-t" rows="12" readonly>${esc(txt)}</textarea><div class="dlg-foot"><span></span><button type="button" class="btn" data-act="fechar">Fechar</button></div>`);$('#cp-t').select()}},
};
async function submitDlg(){
  const err=$('#dlg-err');const fail=m=>{if(err)err.textContent=m};
  if(dlgKind==='mil'){
    const nomeV=$('#mi-nome').value.trim();if(!nomeV)return fail('Informe o nome de guerra.');
    const id=dlgData.id||newId('m'),old=state.militares[id]||{};
    const ent=$('#mi-ent').value||today(),sai=$('#mi-sai').value||null;if(sai&&sai<=ent)return fail('A saída precisa ser depois da entrada.');
    const data={escala:$('#mi-esc').value,ordem:parseInt($('#mi-ord').value)||1,grad:$('#mi-grad').value.trim(),nome:nomeV,entrada:ent,saida:sai,
      folgaIniP:Math.max(0,parseInt($('#mi-fp').value)||0),folgaIniV:Math.max(0,parseInt($('#mi-fv').value)||0),
      exemplo:!!old.exemplo&&old.nome===nomeV&&old.grad===$('#mi-grad').value.trim()};
    closeDlg();await mutate(()=>store.setMilitar(id,data),dlgData.id?'Militar atualizado':'Militar adicionado');
  }else if(dlgKind==='imp'){
    const linhas=$('#im-txt').value.split(/\r?\n/).map(s=>s.replace(/\t/g,' ').trim()).filter(Boolean);if(!linhas.length)return fail('Cole pelo menos um nome.');
    const rmEx=$('#im-ex')?.checked,esp=$('#im-esp').checked,c=cfg();
    const gre=/^(sd\s*ev|sd|cb|3[ºo°]?\s*sgt|2[ºo°]?\s*sgt|1[ºo°]?\s*sgt|st|asp|2[ºo°]?\s*ten|1[ºo°]?\s*ten|cap)\.?\s+/i;
    closeDlg();
    await mutate(async()=>{
      if(rmEx)for(const m of milsEsc().filter(m=>m.exemplo)){for(const a of Object.values(state.afast).filter(a=>a.militarId===m.id))await store.delAfast(a.id);await store.delMilitar(m.id)}
      let ord=Math.max(0,...milsEsc().map(x=>x.ordem||0));const n=linhas.length,ent=today()<c.inicio?c.inicio:today();
      for(let i=0;i<n;i++){const L=linhas[i],mm=L.match(gre);let grad='',nm=L;if(mm){grad=mm[1].replace(/\s+/g,' ').replace(/^(\d)[ºo°]?\s*/,'$1º ');grad=grad.charAt(0).toUpperCase()+grad.slice(1).toLowerCase().replace('sgt','Sgt').replace('ten','Ten');if(/^st$/i.test(mm[1]))grad='ST';nm=L.slice(mm[0].length)}
        const per=Math.max(1,Math.round(n/c.porDia));
        await store.setMilitar(newId('m'),{escala:ui.esc,ordem:++ord,grad,nome:nm,entrada:ent,saida:null,folgaIniP:esp?Math.floor((n-1-i)*per/n):0,folgaIniV:esp?Math.floor(((i+Math.floor(n/2))%n)*per/n):0,exemplo:false});
      }},`${linhas.length} militares importados`);
  }else if(dlgKind==='af'){
    const mil=$('#af-mil').value,ini=$('#af-i').value,fim=$('#af-f').value||null;
    if(!mil)return fail('Escolha o militar.');if(!ini)return fail('Informe o primeiro dia fora.');if(fim&&fim<ini)return fail('O último dia não pode ser antes do primeiro.');
    const id=dlgData.id||newId('a');const data={militarId:mil,tipo:$('#af-t').value,inicio:ini,fim,obs:$('#af-o').value.trim()};
    closeDlg();await mutate(()=>store.setAfast(id,data),`Afastamento registrado: ${nome(mil)}`);
  }else if(dlgKind==='day'){
    const ids=[];for(let i=0;i<dlgData.N;i++){const v=$('#dd-s'+i).value;if(v){if(ids.includes(v))return fail(nome(v)+' aparece duas vezes.');ids.push(v)}}
    const {d,cor}=dlgData,m=monthKey(ui.esc,d.slice(0,7)),obs=$('#dd-o').value.trim();closeDlg();
    await mutate(async()=>{const dias={...(state.meses[m]?.dias||{})};dias[d]={ids,nomes:ids.map(i=>nome(i)),cor,manual:true,obs};await store.setMonth(m,dias)},`Escala de ${br(d)} ajustada`);
  }else closeDlg();
}

  else if(id==='af-tipo'){ui.afTipo=e.target.value;render()}
  else if(id==='bk-file'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importarBackup(String(r.result));r.readAsText(f)}});
window.addEventListener('hashchange',render);
dlg.addEventListener('close',()=>{dlgKind=null});

/* ===================== Appwrite (versão independente: GitHub / Vercel) =====================
   Usa uma única coleção no Appwrite com dois atributos: "col" (string) e "dados" (string grande, JSON).
   O id de cada documento é "<coleção>.<id>" (ex.: militares.m01, meses.cabo_2026-10, config.geral).
   Expõe a mesma interface usada pela página (doc().set/delete/onSnapshot, collection().onSnapshot). */
function telaLogin(account,erro){
  return new Promise(res=>{
    $('#main').innerHTML=`<section class="card" style="max-width:420px;margin:40px auto;display:grid;gap:12px">
      <h2>Entrar</h2><p class="small muted" style="margin:0">Use o e-mail e a senha cadastrados no Appwrite (Auth → Users).</p>
      <form id="login-f" style="display:grid;gap:12px"><label class="f">E-mail<input type="email" id="lg-e" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label class="f">Senha<input type="password" id="lg-s" autocomplete="current-password" required></label>
      <div class="err" id="lg-err">${esc(erro||'')}</div><button class="btn pri" type="submit">Entrar</button></form></section>`;
    $('#login-f').addEventListener('submit',async ev=>{ev.preventDefault();
      try{await account.createEmailPasswordSession($('#lg-e').value.trim().toLowerCase(),$('#lg-s').value);res()}
      catch(e){const t=e&&e.type||'',c=e&&e.code;let m;
        if(t==='user_invalid_credentials'||c===401&&/credential|password/i.test(e.message||''))m='E-mail ou senha incorretos.';
        else if(c===429)m='Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
        else if(t==='user_session_already_exists'){res();return}
        else if(!c||c===0||/fetch|network|cors/i.test(e.message||''))m='Sem resposta do Appwrite. Confira se o endereço deste site ('+location.hostname+') está em Overview → Add app → Web.';
        else m='Não foi possível entrar.';
        $('#lg-err').textContent=m+' [detalhe: '+(c||'-')+' '+(t||'')+' '+(e&&e.message||'')+']'}});
  });
}
async function appwriteDb(cfgA){
  const {Client,Databases,Account,Query}=window.Appwrite;
  const client=new Client().setEndpoint(cfgA.endpoint).setProject(cfgA.projectId);
  const account=new Account(client),dbs=new Databases(client),D=cfgA.databaseId,C=cfgA.collectionId;
  let user=null;try{user=await account.get()}catch(e){}
  if(!user){await telaLogin(account);user=await account.get()}
  awAccount=account;
  const cache={},lis={};
  const split=$id=>{const i=$id.indexOf('.');return[$id.slice(0,i),$id.slice(i+1)]};
  const put=d=>{const [col,id]=split(d.$id);let v={};try{v=JSON.parse(d.dados||'{}')}catch(e){}(cache[col]||=new Map()).set(id,v)};
  const snapOf=col=>{const m=cache[col]||new Map();return{docs:[...m].map(([id,v])=>({id,exists:true,data:()=>v,metadata:{}})),size:m.size,empty:!m.size,metadata:{}}};
  const emit=col=>(lis[col]||[]).forEach(f=>f(snapOf(col)));
  let cursor=null;
  for(;;){const q=[Query.limit(100)];if(cursor)q.push(Query.cursorAfter(cursor));
    const r=await dbs.listDocuments(D,C,q);r.documents.forEach(put);
    if(r.documents.length<100)break;cursor=r.documents[r.documents.length-1].$id}
  client.subscribe([`databases.${D}.collections.${C}.documents`,`databases.${D}.tables.${C}.rows`],ev=>{
    const d=ev.payload;if(!d||!d.$id||d.$id.indexOf('.')<0)return;const [col,id]=split(d.$id);
    if(ev.events.some(e=>e.endsWith('.delete')))cache[col]?.delete(id);else put(d);emit(col)});
  const api={
    collection:col=>({onSnapshot(next){(lis[col]||=[]).push(next);setTimeout(()=>next(snapOf(col)));return()=>{}}}),
    doc(path){const [col,id]=path.split('/'),$id=col+'.'+id;return{
      async set(data){const body={col,dados:JSON.stringify(data)};
        try{await dbs.updateDocument(D,C,$id,body)}catch(e){if(e.code===404)await dbs.createDocument(D,C,$id,body);else throw e}
        (cache[col]||=new Map()).set(id,data);emit(col)},
      async delete(){try{await dbs.deleteDocument(D,C,$id)}catch(e){if(e.code!==404)throw e}cache[col]?.delete(id);emit(col)},
      onSnapshot(next){const f=()=>{const v=cache[col]?.get(id);next({id,exists:v!==undefined,data:()=>v,metadata:{}})};
        (lis[col]||=[]).push(f);setTimeout(f);return()=>{}}}}};
  return api;
}
let awAccount=null;
const downloadsLocal={async save({filename,data}){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return{status:'saved'}}};

/* ===================== backup ===================== */
function backupJSON(){const o={sistema:'escala-servico',versao:1,gerado:new Date().toISOString(),config:state.config,militares:{},afastamentos:{},meses:state.meses};
  for(const [id,m] of Object.entries(state.militares)){const {id:_,...r}=m;o.militares[id]=r}
  for(const [id,a] of Object.entries(state.afast)){const {id:_,...r}=a;o.afastamentos[id]=r}
  return JSON.stringify(o,null,1)}
async function importarBackup(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Arquivo inválido: não é um backup da escala.');return}
  if(o.sistema!=='escala-servico'){toast('Arquivo inválido: não é um backup da escala.');return}
  if(!state.canWrite){toast('Você tem acesso só de leitura.');return}
  state.busy=true;let n=0;
  try{if(o.config)await store.setConfig(o.config);
    for(const [id,m] of Object.entries(o.militares||{})){await store.setMilitar(id,m);n++}
    for(const [id,a] of Object.entries(o.afastamentos||{})){await store.setAfast(id,a);n++}
    for(const [k,v] of Object.entries(o.meses||{})){await store.setMonth(k,v.dias||{});n++}
    toast(`Backup importado: ${n} registros.`)}
  catch(e){console.error(e);toast(`Importação parou depois de ${n} registros. Tente de novo.`)}
  finally{state.busy=false;render()}}

/* ===================== inicialização ===================== */
function loadDemo(){const ex=exemplo(ESC_ORDEM);state.militares=ex.mil;state.afast=ex.af;state.config=ex.config;state.mode='demo';state.loaded=true;render()}
function subscribe(){
  let pend=4;const first={};
  const wrap=(k,f)=>snap=>{f(snap);if(!first[k]){first[k]=1;if(--pend===0)state.loaded=true}render()};
  const onErr=e=>{console.error(e);if(e?.code==='revoked'){toast('O acesso a esta escala foi alterado.')}};
  const toMap=s=>{const o={};s.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});return o};
  db.collection('militares').onSnapshot(wrap('m',s=>{state.militares=toMap(s)}),onErr);
  db.collection('afastamentos').onSnapshot(wrap('a',s=>{state.afast=toMap(s)}),onErr);
  db.collection('meses').onSnapshot(wrap('x',s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());state.meses=o}),onErr);
  db.doc('config/geral').onSnapshot(wrap('c',s=>{state.config=s.exists?{...s.data()}:{}}),onErr);
}
render();
(async()=>{
  const AW=window.ESCALA_CONFIG&&window.ESCALA_CONFIG.appwrite;
  if(AW&&AW.projectId&&!/SEU_/.test(AW.projectId)&&window.Appwrite){
    try{db=await appwriteDb(AW);state.mode='appwrite';downloads=downloadsLocal;subscribe();return}
    catch(e){console.error(e);db=null;$('#main').innerHTML=`<section class="card empty"><h2>Não foi possível conectar ao Appwrite</h2><p>${esc(e.message||String(e))}</p><p>Confira o arquivo config.js (endpoint, projeto, banco e coleção) e se o domínio está em Platforms.</p></section>`;return}
  }
  const C=window.claude;
  if(!C||!C.use){loadDemo();return}
  try{db=await C.use('db')}catch(e){db=null}
  if(!db){loadDemo();return}
  state.mode='db';subscribe();
  try{downloads=await C.use('downloads')}catch(e){}
  try{const u=await C.use('user');if(u){const w=await u.can('data.write');if(w===false)state.canWrite=false}}catch(e){}
  render();
})();
